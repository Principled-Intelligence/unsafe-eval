# Jev 1.13 on TypeSafe's System One API, under the jev protocol.
# Jev does not generate text: it answers one native Choice question about a
# structured state, through the `typesafe` model provider in this package.
# The model is the exact version `jev-1.13.0`, never the `jev-latest` or
# `jev-preview` aliases, which shift between releases. The provider additionally
# fails the run when the response reports a different served version, so alias
# drift is detectable rather than silently mis-attributed.
# A hosted run still pins its inputs rather than its outputs, and Jev is not
# bit-reproducible: two runs of this configuration differ slightly. See
# docs/reproducibility.md.
task:
  task: unsafe_eval/simple_safety_tests
  args:
    protocol: jev
    dataset_revision: 98223c5d8c4059c8f4d8fe2fec8720ee8a20d3c5

model:
  model: typesafe/jev-1.13.0
  args:
    revision: jev-1.13.0
