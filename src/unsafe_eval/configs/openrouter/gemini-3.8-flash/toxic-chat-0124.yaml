# Gemini 3.8 Flash over OpenRouter: gemini protocol, openrouter route.
# Same prompt and options as google/gemini-3.8-flash, which reaches the same build over
# Vertex AI through Google's SDK.
# The model is OpenRouter's dated slug `gemini-3.8-flash-20260902`;
# the `google/gemini-3.8-flash` alias moves when a new build ships.
# Routing is pinned to Vertex AI's global endpoint, the service and region the google
# configurations call, with fallbacks off. OpenRouter also serves this model from
# Google AI Studio, which blocks more of these prompts.
# The protocol pins seed 0, which OpenRouter passes on to Google. Inspect's google
# provider sends none, so the seed is the one parameter in which the two routes differ.
# OpenRouter exposes no Gemini safety settings, so this configuration cannot set them.
# A hosted run pins its inputs; its outputs can still vary. See docs/reproducibility.md.
task:
  task: unsafe_eval/toxic_chat_prompt_safety
  args:
    protocol: gemini
    dataset_revision: 29df8e4dba60e1f4af4b4075c0705c5b313548a8
    protocol_options:
      route: openrouter
      output_fields: ["user_safety"]
      reasoning_effort: medium

model:
  model: openrouter/google/gemini-3.8-flash-20260902
  args:
    provider:
      order: ["google-vertex/global"]
      allow_fallbacks: false
      require_parameters: true
