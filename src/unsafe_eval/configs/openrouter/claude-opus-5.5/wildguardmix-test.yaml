# Claude Opus 5.5 over OpenRouter: claude protocol, openrouter route.
# Same prompt and options as anthropic/claude-opus-5.5, which reaches the same build over
# Anthropic's API.
# The model is OpenRouter's dated slug `claude-opus-5.5-20260921`; the
# `anthropic/claude-opus-5.5` alias moves when a new build ships.
# Routing is pinned to Anthropic with fallbacks off. OpenRouter also serves this model
# from other clouds, and some of them do not accept a JSON response schema; a request sent
# to one of those could lose the schema.
# The protocol sends no seed, because OpenRouter's Anthropic endpoints take none.
# `reasoning_effort` is Claude Opus 5.5's API default, `medium`.
# A hosted run pins its inputs; its outputs can still vary. See docs/reproducibility.md.
task:
  task: unsafe_eval/wildguard_mix_prompt_safety
  args:
    protocol: claude
    dataset_revision: d29c47f41c8b51348b5c8e8c81c039b3132b66d1
    protocol_options:
      route: openrouter
      output_fields: ["user_safety"]
      reasoning_effort: medium

model:
  model: openrouter/anthropic/claude-opus-5.5-20260921
  args:
    provider:
      order: ["anthropic"]
      allow_fallbacks: false
      require_parameters: true
