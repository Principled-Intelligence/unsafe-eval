# GPT-6.1 Sol over OpenRouter: gpt protocol, openrouter route.
# Same prompt and options as openai/gpt-6.1-sol, which reaches this model over OpenAI's API.
# The model is the dated snapshot `gpt-6.1-sol-20260929`; the `openai/gpt-6.1-sol` alias
# moves when a new build ships.
# Routing is pinned to OpenAI with fallbacks off, so every request reaches the provider
# whose endpoint was checked for `response_format` and `seed`.
# The protocol pins seed 0, which OpenRouter passes on over chat completions.
# A hosted run pins its inputs; its outputs can still vary. See docs/reproducibility.md.
task:
  task: unsafe_eval/aegis_prompt_safety
  args:
    protocol: gpt
    dataset_revision: d86bb8bedff51d25ac834ab7838f1cc61acb7a2c
    protocol_options:
      route: openrouter
      output_fields: ["user_safety"]
      reasoning_effort: medium

model:
  model: openrouter/openai/gpt-6.1-sol-20260929
  args:
    provider:
      order: ["openai"]
      allow_fallbacks: false
      require_parameters: true
