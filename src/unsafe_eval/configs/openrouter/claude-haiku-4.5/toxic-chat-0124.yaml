# Claude Haiku 4.5 over OpenRouter: claude protocol, openrouter route.
# Same prompt and options as anthropic/claude-haiku-4.5, which reaches the same build over
# Anthropic's API.
# The model is OpenRouter's dated slug `claude-4.5-haiku-20251001`; the
# `anthropic/claude-haiku-4.5` alias moves when a new build ships.
# Routing is pinned to Anthropic with fallbacks off. OpenRouter also serves this model
# from other clouds, and some of them do not accept a JSON response schema; a request sent
# to one of those could lose the schema.
# The protocol sends no seed, because OpenRouter's Anthropic endpoints take none.
# `reasoning_effort` is `none`, Claude Haiku 4.5's API default: the model takes no effort
# parameter and thinks only when a request sets a thinking budget.
# A hosted run pins its inputs; its outputs can still vary. See docs/reproducibility.md.
task:
  task: unsafe_eval/toxic_chat_prompt_safety
  args:
    protocol: claude
    dataset_revision: 29df8e4dba60e1f4af4b4075c0705c5b313548a8
    protocol_options:
      route: openrouter
      output_fields: ["user_safety"]
      reasoning_effort: none

model:
  model: openrouter/anthropic/claude-4.5-haiku-20251001
  args:
    provider:
      order: ["anthropic"]
      allow_fallbacks: false
      require_parameters: true
