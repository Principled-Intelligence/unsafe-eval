# GPT-5.6 Terra over OpenAI's API: gpt protocol, openai route.
# Same prompt and options as openrouter/gpt-5.6-terra, which reaches this model over
# OpenRouter, so comparing the two isolates the route.
# The model is the `gpt-5.6-terra` alias, because OpenAI publishes no dated snapshot for
# Terra. The build that answers is whatever the alias points to on the day, and the run
# records a null model revision, so this configuration is a runnable example rather than a
# reproducible run.
# The protocol sends no seed on this route: Inspect sends GPT-5 and later models on
# `openai/` to the Responses API, which ignores one.
# A hosted run pins its inputs; its outputs can still vary. See docs/reproducibility.md.
task:
  task: unsafe_eval/simple_safety_tests
  args:
    protocol: gpt
    dataset_revision: 98223c5d8c4059c8f4d8fe2fec8720ee8a20d3c5
    protocol_options:
      route: openai
      output_fields: ["user_safety"]
      reasoning_effort: medium

model:
  model: openai/gpt-5.6-terra
