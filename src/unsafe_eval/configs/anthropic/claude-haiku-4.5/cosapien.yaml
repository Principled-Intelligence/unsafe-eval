# Claude Haiku 4.5 over Anthropic's API: claude protocol, anthropic route.
# Same prompt and options as openrouter/claude-haiku-4.5, which reaches the same build
# over OpenRouter, so comparing the two isolates the route.
# The model is the dated snapshot `claude-haiku-4-5-20251001`. The `claude-haiku-4-5`
# alias resolves to it today and moves when a new build ships.
# The protocol sends no seed, because Anthropic's API has none.
# Each sample carries its own policy, which is written into the benchmark's instruction,
# so the sample is judged against the policy it was labelled under.
# `reasoning_effort` is `none`, Claude Haiku 4.5's API default: the model takes no effort
# parameter and thinks only when a request sets a thinking budget.
# A hosted run pins its inputs; its outputs can still vary. See docs/reproducibility.md.
task:
  task: unsafe_eval/cosapien_prompt_safety
  args:
    protocol: claude
    dataset_revision: 29bb85bd4f84319d825517519278c8f8959fa031
    protocol_options:
      route: anthropic
      output_fields: ["user_safety"]
      reasoning_effort: none

model:
  model: anthropic/claude-haiku-4-5-20251001
