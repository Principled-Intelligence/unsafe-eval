# Claude Opus 5.5 over Anthropic's API: claude protocol, anthropic route.
# Same prompt and options as openrouter/claude-opus-5.5, which reaches the same build over
# OpenRouter, so comparing the two isolates the route.
# The model ID `claude-opus-5-5` names one build: Anthropic's Models API returns it
# unchanged, while an alias resolves to a dated snapshot.
# The protocol sends no seed, because Anthropic's API has none.
# `reasoning_effort` is Claude Opus 5.5's API default, `medium`.
# A hosted run pins its inputs; its outputs can still vary. See docs/reproducibility.md.
task:
  task: unsafe_eval/toxic_chat_prompt_safety
  args:
    protocol: claude
    dataset_revision: 29df8e4dba60e1f4af4b4075c0705c5b313548a8
    protocol_options:
      route: anthropic
      output_fields: ["user_safety"]
      reasoning_effort: medium

model:
  model: anthropic/claude-opus-5-5
