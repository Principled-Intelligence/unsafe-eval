# Gemini 4 Carbon on Vertex AI through Google's SDK: gemini protocol, google route.
# Google serves it only to verified enterprise customers.
# Same prompt and thinking level as google/gemini-4-argon.
# The project comes from GOOGLE_CLOUD_PROJECT. Override the region with `-M location=<region>`.
# Gemini's adjustable safety filters are set to `none`, Inspect's default, so the run
# log records them. Filters Google does not let a caller adjust still apply.
# A hosted run pins its inputs; its outputs can still vary. See docs/reproducibility.md.
task:
  task: unsafe_eval/openai_moderation_prompt_safety
  args:
    protocol: gemini
    dataset_revision: f4ab51b5edd3bfbcb349a56324274235b674e0e4
    protocol_options:
      route: google
      output_fields: ["user_safety"]
      reasoning_effort: medium

model:
  model: google/vertex/gemini-4-carbon
  args:
    location: global
    safety_settings:
      civic_integrity: none
      dangerous_content: none
      harassment: none
      hate_speech: none
      sexually_explicit: none
