# Gemini 4 Hydrogen on Vertex AI through Google's SDK: gemini protocol, google route.
# Google ships it as a short-term GA release with at least 45 days' retirement notice.
# Same prompt as google/gemini-4-argon, at high thinking, Google's default for this model.
# The model code `gemini-4-hydrogen` is one Google lists as stable, which it documents as
# pointing to one specific model.
# The project comes from GOOGLE_CLOUD_PROJECT. Override the region with `-M location=<region>`.
# Gemini's adjustable safety filters are set to `none`, Inspect's default, so the run
# log records them. Filters Google does not let a caller adjust still apply.
# A hosted run pins its inputs; its outputs can still vary. See docs/reproducibility.md.
task:
  task: unsafe_eval/simple_safety_tests
  args:
    protocol: gemini
    dataset_revision: 98223c5d8c4059c8f4d8fe2fec8720ee8a20d3c5
    protocol_options:
      route: google
      output_fields: ["user_safety"]
      reasoning_effort: high

model:
  model: google/vertex/gemini-4-hydrogen
  args:
    location: global
    safety_settings:
      civic_integrity: none
      dangerous_content: none
      harassment: none
      hate_speech: none
      sexually_explicit: none
