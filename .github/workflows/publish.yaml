name: Publish

# `published` (not `created`): a draft release that is published later never fires `created`.
on:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/unsafe-eval/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # hatch-vcs derives the package version from git tags
          fetch-depth: 0
      - name: Install uv
        # setup-uv publishes only exact version tags.
        uses: astral-sh/setup-uv@v10.3.2

      - name: Build unsafe-eval
        run: uv build
      - name: Publish unsafe-eval
        # --check-url skips files already on PyPI so workflow re-runs stay green
        run: uv publish --check-url https://pypi.org/simple/
